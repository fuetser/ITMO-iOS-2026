included:
  - QuoteOfTheDay
  - QuoteOfTheDayTests
  - QuoteOfTheDayUITests

excluded:
  - .build
  - DerivedData

disabled_rules:
  - todo

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

reporter: xcode
